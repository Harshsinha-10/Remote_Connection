name: Personal RDP

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # 1. Enable Windows Remote Desktop
      - name: Configure Windows RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          Restart-Service -Name TermService -Force


      # 2. Create your dedicated RDP account
      - name: Create RDP User
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
            throw "RDP_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -AccountNeverExpires `
              -UserMayNotChangePassword:$true
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue


      # 3. Connect GitHub runner to your Tailscale network
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-rdp


      # 4. Get the Tailscale IP
      - name: Get Tailscale IP
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          Start-Sleep -Seconds 5

          $tsIP = & $tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
            throw "Could not obtain Tailscale IPv4 address."
          }

          $tsIP = $tsIP.Trim()

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # 5. Allow RDP only from Tailscale addresses
      - name: Restrict RDP Firewall
        shell: powershell
        run: |
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10


      # 6. Display connection information
      - name: Display RDP Information
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}

        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "       PERSONAL RDP IS READY"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "RDP Port     : 3389"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "Password     : Stored in GitHub Secret"
          Write-Host ""
          Write-Host "RDP Address  : $env:TAILSCALE_IP`:3389"
          Write-Host ""
          Write-Host "======================================"


      # 7. Keep the Windows machine alive
      - name: Keep RDP Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP Active"
            Start-Sleep -Seconds 300
          }
